name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: PFFFT
          - os: ubuntu-latest
            backend: KISSFFT
          - os: macos-latest
            backend: PFFFT
          - os: macos-latest
            backend: KISSFFT
          - os: macos-latest
            backend: ACCELERATE
          - os: windows-latest
            backend: PFFFT
          - os: windows-latest
            backend: KISSFFT

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPAULSTRETCH_FFT_BACKEND=${{ matrix.backend }}
          -DPAULSTRETCH_BUILD_WASM=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  wasm:
    name: wasm (emscripten)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: >
          emcmake cmake -S . -B build-wasm
          -DCMAKE_BUILD_TYPE=Release
          -DPAULSTRETCH_BUILD_WASM=ON
          -DPAULSTRETCH_BUILD_TESTS=OFF
          -DPAULSTRETCH_BUILD_EXAMPLES=OFF
          -DPAULSTRETCH_ENABLE_SIMD=${{ matrix.simd }}

      - name: Build
        run: cmake --build build-wasm --config Release --parallel

      - name: Verify artifacts
        run: |
          test -f npm/dist/paulstretch.js
          test -f npm/dist/paulstretch.wasm
          ls -la npm/dist/

      # Only the SIMD=ON build (the production artifact) is packed; SIMD=OFF
      # is just a build-compatibility check.
      - name: npm pack (verify package layout)
        if: matrix.simd == 'ON'
        working-directory: npm
        run: |
          npm pack --dry-run
          npm pack
          ls -la *.tgz

      - name: Upload npm tarball
        if: matrix.simd == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: paulstretch-wasm-npm
          path: npm/*.tgz
          if-no-files-found: error
