name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: PFFFT
          - os: ubuntu-latest
            backend: KISSFFT
          - os: macos-latest
            backend: PFFFT
          - os: macos-latest
            backend: KISSFFT
          - os: macos-latest
            backend: ACCELERATE
          - os: windows-latest
            backend: PFFFT
          - os: windows-latest
            backend: KISSFFT

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPAULSTRETCH_FFT_BACKEND=${{ matrix.backend }}
          -DPAULSTRETCH_BUILD_WASM=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  wasm:
    name: wasm (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      # Builds both the SIMD and scalar wasm and assembles npm/dist. The scalar
      # (paulstretch.nosimd.wasm) is the fallback for WebViews without WASM SIMD.
      - name: Build WASM (SIMD + scalar)
        run: scripts/build-wasm.sh

      - name: Verify artifacts
        run: |
          test -f npm/dist/paulstretch.js
          test -f npm/dist/paulstretch.wasm
          test -f npm/dist/paulstretch.nosimd.wasm
          ls -la npm/dist/

      - name: npm pack (verify package layout)
        working-directory: npm
        run: |
          npm pack --dry-run
          npm pack
          ls -la *.tgz

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: paulstretch-wasm-npm
          path: npm/*.tgz
          if-no-files-found: error

      # Confirm the WASM actually loads and runs in a real browser, not just in
      # Node — once per wasm binary (SIMD and scalar) via the shared glue.
      - name: Browser smoke test (headless Chrome)
        run: |
          set -e
          for wasm in paulstretch.wasm paulstretch.nosimd.wasm; do
            echo "::group::browser smoke test — $wasm"
            rm -rf tests/browser/paulstretch.wasm
            cp npm/dist/paulstretch.js tests/browser/
            cp "npm/dist/$wasm" tests/browser/paulstretch.wasm
            python3 -m http.server 8765 --directory tests/browser >/dev/null 2>&1 &
            SERVER=$!
            for i in $(seq 1 10); do
              curl -sf http://localhost:8765/index.html >/dev/null && break
              sleep 0.5
            done
            DOM=$(google-chrome --headless=new --disable-gpu --no-sandbox \
                    --virtual-time-budget=10000 \
                    --dump-dom http://localhost:8765/index.html)
            kill $SERVER 2>/dev/null || true
            echo "$DOM"
            echo "$DOM" | grep -q 'data-status="ok"' || {
              echo "::error::browser smoke test FAILED for $wasm — expected data-status=\"ok\" in DOM"
              exit 1
            }
            echo "::endgroup::"
          done

