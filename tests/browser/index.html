<!doctype html>
<!--
  Browser smoke test for paulstretch-wasm. Loads the ES module, instantiates
  OfflineRenderer, runs a small render, and writes pass/fail status into the
  DOM. CI grabs the page with `google-chrome --dump-dom` and asserts that
  `data-status="ok"` appears.

  Expects paulstretch.js + paulstretch.wasm to be served alongside this
  file (CI stages them via `cp npm/dist/* tests/browser/`).
-->
<html>
<head><meta charset="utf-8"><title>paulstretch wasm browser smoke test</title></head>
<body>
<pre id="out">running...</pre>
<script type="module">
const out = document.getElementById('out');
const log = (...args) => out.textContent += '\n' + args.join(' ');
const fail = (msg) => { out.textContent = 'FAIL ' + msg; out.dataset.status = 'fail'; };
try {
  const { default: PaulstretchModule } = await import('./paulstretch.js');
  const M = await PaulstretchModule();
  out.textContent = '';
  log('backend:', M.fftBackendName());
  log('simd:', M.fftSimdArch(), 'width:', M.fftSimdSize());

  const r = new M.OfflineRenderer(4, 1024, 44100, M.Window.Hann, 0);
  const input = new Float32Array(4410);
  for (let i = 0; i < input.length; i++) {
    input[i] = 0.5 * Math.sin(2 * Math.PI * 440 * i / 44100);
  }
  const flat = r.renderMono(input);
  log('flat 4x: input', input.length, '-> output', flat.length);
  if (flat.length <= input.length) throw new Error('output not stretched');

  r.setStretchEnvelope(
    new Float32Array([0, 0.5, 1]),
    new Float32Array([1, 4, 1]),
  );
  const env = r.renderMono(input);
  log('env 1->4->1: output', env.length);
  if (env.length === flat.length) throw new Error('envelope did not change length');

  r.delete();

  // Chunked render: same algorithm as renderMono, delivered incrementally so
  // huge outputs never need the whole buffer in WASM memory at once. Accumulate
  // the chunks JS-side. Per-instance PRNG seed means the samples won't be
  // bit-identical to `flat`, but the total length must match and the callback
  // must fire repeatedly with finite data (proving the bounded-memory path).
  const rc = new M.OfflineRenderer(4, 1024, 44100, M.Window.Hann, 0);
  let chunkCount = 0;
  let chunkFrames = 0;
  let allFinite = true;
  const total = rc.renderMonoChunked(input, (chunk) => {
    chunkCount++;
    chunkFrames += chunk.length;
    for (let i = 0; i < chunk.length; i++) {
      if (!Number.isFinite(chunk[i])) allFinite = false;
    }
  });
  log('chunked 4x: output', total, 'in', chunkCount, 'chunks');
  if (chunkCount < 2) throw new Error('expected multiple chunks, got ' + chunkCount);
  if (!allFinite) throw new Error('chunked output had non-finite samples');
  if (total !== chunkFrames || total !== flat.length) {
    throw new Error('chunked length ' + total + ' != flat length ' + flat.length);
  }
  rc.delete();

  out.dataset.status = 'ok';
} catch (e) {
  fail((e && e.message) + '\n' + (e && e.stack));
}
</script>
</body>
</html>
